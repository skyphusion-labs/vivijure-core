name: changelog

# core#178: two PRs (#176, #177) shipped src/ changes with no CHANGELOG.md entry, caught only by a
# human reading RELEASES.md instead of trusting a description of it. This job fails a PR that
# touches src/ without also touching CHANGELOG.md or adding a changelog.d/ fragment (core#202,
# ported convention from vivijure-cf#546, itself ported from vivijure-control-plane cp#358).
#
# Deliberately narrow: src/ only, matching this repo package surface (no public/ or modules/
# top-level directories, unlike vivijure-cf). Touch, not content -- the check exists to make the
# author stop and decide, not to grade prose. Escape hatch is the no-changelog label, so a
# deliberate skip is a recorded decision on the PR rather than a silent one.
#
# THREE-DOT, NOT TWO. See scripts/changelog-entry-required.mjs and
# tests/changelog-entry-required.test.ts, which reproduce the two-dot false pass as a fixture and
# prove three-dot fixes it.
#
# Not part of the required-check set the CI workflow enforces; this job id can be renamed freely.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: CHANGELOG.md entry required for src/ changes
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/changelog-entry-required.mjs . "$BASE_SHA" "$HEAD_SHA" "$LABELS_JSON"

  # CHANGELOG IMMUTABILITY (core#231). A released `## [X.Y.Z]` / `## vX.Y.Z` section should be
  # byte-identical to the same section in CHANGELOG.md AT its own git tag
  # (`vivijure-core-vX.Y.Z`); scripts/changelog-released-immutable.py checks that property of the
  # TREE, not of a diff. Ported from vivijure-cf (scripts/changelog-released-immutable.py, cf#551
  # piece 2), itself ported from vivijure-control-plane (cp#219/cp#245); see that script own
  # docstring for the full mechanism and tests/changelog-released-immutable.test.py for the
  # mutation-test proof.
  #
  # ADVISORY, NOT BLOCKING, ON PURPOSE. Live-measured at port time against origin/main 25d4a87
  # (2026-08-17): the guard reports THREE released sections with pre-existing drift -- v1.18.0,
  # v1.13.0, v1.3.0 -- plus several older tags whose CHANGELOG.md predates the heading or the file
  # (reported UNCHECKED, not counted as a pass). None of that is new work introduced by this job;
  # it is debt core#231 already named and scoped OUT of this port as a release-lane content
  # decision, not a code change. Wiring the live-repo check below as a normal blocking step would
  # turn every open and future PR permanently red on debt this job cannot fix. So only the
  # "guard against the real CHANGELOG.md" step below is continue-on-error; the mutation-test step
  # above it is a real bar (it proves the MECHANISM works, entirely on synthetic fixtures plus a
  # self-consistency check that adapts to whatever drift main currently has, so it is not expected
  # to ever go red for a reason unrelated to the guard itself). Once the live run is clean, this
  # job can be tightened to a normal blocking step -- see the guard own docstring.
  changelog-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Changelog immutability guard tests (core#231)
        run: python3 tests/changelog-released-immutable.test.py

      - name: Changelog immutability against the live CHANGELOG.md (advisory, pre-existing drift)
        continue-on-error: true
        run: python3 scripts/changelog-released-immutable.py .
