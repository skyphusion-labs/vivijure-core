name: ci

# Platform ICD + conformance + orchestration unit tests. Required check name: `ci`.
# PUBLIC repo: GitHub-hosted ubuntu-latest (fork-safe).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-tags: core#119 changelog-version guard needs vivijure-core-v* tags visible
      # (git tag -l) so Unreleased-on-a-spent-version fails closed, not as a vacuous green.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          # core#202: tests/changelog-released-entries.test.ts asks an ANCESTRY question
          # (is the commit that introduced this entry an ancestor of that releases tag?), and
          # merge-base cannot answer it on a shallow clone. fetch-tags alone is not enough --
          # tags present and history present are separate facts, and the default depth is 1.
          # The guard REFUSES rather than passing when the clone is shallow, so without this the
          # failure is loud and misdirected rather than silent; this is what makes it measure.
          # core#209: tests/releases-ledger.test.ts resolves each ledger row tag to its COMMIT
          # (git rev-list -n 1 <tag>), which a shallow clone cannot do either -- fetch-tags
          # supplies the tag OBJECTS and not the history behind them, and this guard also
          # REFUSES rather than passing when the clone is shallow.
          fetch-depth: 0
      - name: Checkout vivijure (module manifest drift guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # Prefer data-only modules/*/src/manifest.ts (cf#285) -- vitest aliases to the leaf when
          # present, so the guard does not inherit entrypoint import graphs. modules/_shared stays
          # listed for checkouts that still only have MANIFEST on the entrypoint (pre-cf#285).
          # A missing path does not fail at checkout; it fails later as ERR_MODULE_NOT_FOUND.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/finish-rife
            modules/finish-upscale
            modules/finish-blender
            modules/_shared
            migrations
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # core#318: refuse a ledger row left open on a version the registry is already serving.
      #
      # WHY IT RUNS HERE AND NOT ONLY AT RELEASE TIME. Step 8 of a cut sits AFTER the publish, which
      # is after the part that feels like the release is over, and it was skipped on 11 of 47 rows.
      # A release-time-only check is a rule someone has to remember, which is the class this repo
      # keeps re-filing.
      #
      # WHY IT DOES NOT REDDEN EVERY RELEASE. The single newest SERVED version is exempt, because
      # between the publish and the close-row merge main legitimately has a served version with empty
      # cells. The exemption is DERIVED from the registry at run time and cross-checked against
      # dist-tags.latest, never configured -- a hardcoded exempt version would exempt the wrong row
      # forever the moment a release landed and nobody edited it.
      #
      # ON AN UNREADABLE REGISTRY IT EXITS 7 (UNMEASURED) rather than exempting nothing or
      # everything, because both of those read as working. It needs network; it needs no git history.
      - name: Ledger rows closed (core#318)
        run: node scripts/ledger-close.mjs --check
      # core#183: comments in src/ that name a consumer-side file which exists in no live consumer.
      # The consumer repos are checked out HERE rather than assumed: the script REFUSES (exit 2) when
      # no root resolves, so a checkout that silently stops working cannot read as a clean repo.
      # vivijure-cf is already checked out above (into ./vivijure) for the manifest drift guard.
      - name: Checkout consumers (stale-reference detector)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-backend
          path: consumers/vivijure-backend
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-upscale
          path: consumers/vivijure-upscale
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-wan-train
          path: consumers/vivijure-wan-train
      # A FULL vivijure-cf checkout, deliberately NOT the sparse `vivijure` one above. That one is
      # scoped to modules/* for the manifest drift guard, so it cannot contain containers/*/app.py --
      # and pointing the detector at it made five live files read as deleted. A root that is present
      # but incomplete is indistinguishable from a complete one, so the fix is to not reuse a
      # narrowed checkout rather than to try to detect narrowness.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-cf
          path: consumers/vivijure-cf
      - name: Stale consumer references (core#183)
        env:
          VIVIJURE_CONSUMER_ROOTS: consumers/vivijure-backend:consumers/vivijure-upscale:consumers/vivijure-wan-train:consumers/vivijure-cf
        run: node scripts/comment-symbol-refs.mjs

  # core#335, option 1b (lead ruling 2026-11-09): run vivijure-cf's own suite against THIS core build.
  # scripts/consumer-suite.mjs runs cf on its own pin first (the baseline), then packs this commit,
  # installs it into the same tree, proves the installed file is this build, and runs cf again.
  #   PASS        green on both                       -> job green
  #   FAIL        green on its pin, red on this build -> job RED
  #   UNMEASURED  cf red on its own pin, or not proven -> job green, ::warning:: and summary say so
  # UNMEASURED does not block by ruling: a red cf main is cf's defect, not core's. Read the verdict
  # line, never the job colour alone, because PASS and UNMEASURED are both green.
  #
  # NOT REQUIRED YET. It becomes a required check after 5 consecutive core PRs with a PASS verdict,
  # and that switch is recorded on core#335. Only vivijure-cf: it is the one repo that installs this
  # package with a floating range (vivijure-local pins exactly and is on hold; the GPU repos consume
  # the HTTP contract, not the package). cf's browser tests are not run: they test the UI, and they
  # are 4 of cf's 5 minutes. Cost measured on 2026-11-09: about 1.5 to 2 runner minutes, $0 (public).
  consumer-cf:
    name: consumer-cf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/vivijure-cf
          path: cf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            cf/package-lock.json
      - name: Install core (npm pack builds dist through prepare)
        working-directory: core
        run: npm ci --no-audit --no-fund
      - name: cf suite on its own pin, then on this core build (core#335)
        run: node core/scripts/consumer-suite.mjs --core core --consumer cf --name cf
