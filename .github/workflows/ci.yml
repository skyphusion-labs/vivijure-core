name: ci

# Platform ICD + conformance + orchestration unit tests. Required check name: `ci`.
# PUBLIC repo: GitHub-hosted ubuntu-latest (fork-safe).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Checkout vivijure (module manifest drift guard)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # EVERY PATH THESE TWO MODULES IMPORT HAS TO BE IN THIS LIST, not just the module dirs.
          # quality-tier-drift imports the module ENTRY POINTS to read MANIFEST, so it inherits
          # their ENTIRE import graph. A missing path does not fail at checkout; it fails later
          # inside the test as ERR_MODULE_NOT_FOUND, reading like our bug rather than a missing file.
          # modules/_shared is imported by BOTH (../../_shared/runpod-job-log, cf#279). See local#295.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/_shared
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
