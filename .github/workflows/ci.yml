name: ci

# Platform ICD + conformance + orchestration unit tests. Required check name: `ci`.
# PUBLIC repo: GitHub-hosted ubuntu-latest (fork-safe).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-tags: core#119 changelog-version guard needs vivijure-core-v* tags visible
      # (git tag -l) so Unreleased-on-a-spent-version fails closed, not as a vacuous green.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          # core#202: tests/changelog-released-entries.test.ts asks an ANCESTRY question
          # (is the commit that introduced this entry an ancestor of that releases tag?), and
          # merge-base cannot answer it on a shallow clone. fetch-tags alone is not enough --
          # tags present and history present are separate facts, and the default depth is 1.
          # The guard REFUSES rather than passing when the clone is shallow, so without this the
          # failure is loud and misdirected rather than silent; this is what makes it measure.
          # core#209: tests/releases-ledger.test.ts resolves each ledger row tag to its COMMIT
          # (git rev-list -n 1 <tag>), which a shallow clone cannot do either -- fetch-tags
          # supplies the tag OBJECTS and not the history behind them, and this guard also
          # REFUSES rather than passing when the clone is shallow.
          fetch-depth: 0
      - name: Checkout vivijure (module manifest drift guard)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # Prefer data-only modules/*/src/manifest.ts (cf#285) -- vitest aliases to the leaf when
          # present, so the guard does not inherit entrypoint import graphs. modules/_shared stays
          # listed for checkouts that still only have MANIFEST on the entrypoint (pre-cf#285).
          # A missing path does not fail at checkout; it fails later as ERR_MODULE_NOT_FOUND.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/_shared
            migrations
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # core#183: comments in src/ that name a consumer-side file which exists in no live consumer.
      # The consumer repos are checked out HERE rather than assumed: the script REFUSES (exit 2) when
      # no root resolves, so a checkout that silently stops working cannot read as a clean repo.
      # vivijure-cf is already checked out above (into ./vivijure) for the manifest drift guard.
      - name: Checkout consumers (stale-reference detector)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-backend
          path: consumers/vivijure-backend
      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-musetalk
          path: consumers/vivijure-musetalk
      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-upscale
          path: consumers/vivijure-upscale
      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-audio-upscale
          path: consumers/vivijure-audio-upscale
      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-wan-train
          path: consumers/vivijure-wan-train
      # A FULL vivijure-cf checkout, deliberately NOT the sparse `vivijure` one above. That one is
      # scoped to modules/* for the manifest drift guard, so it cannot contain containers/*/app.py --
      # and pointing the detector at it made five live files read as deleted. A root that is present
      # but incomplete is indistinguishable from a complete one, so the fix is to not reuse a
      # narrowed checkout rather than to try to detect narrowness.
      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: consumers/vivijure-cf
      - name: Stale consumer references (core#183)
        env:
          VIVIJURE_CONSUMER_ROOTS: consumers/vivijure-backend:consumers/vivijure-musetalk:consumers/vivijure-upscale:consumers/vivijure-audio-upscale:consumers/vivijure-wan-train:consumers/vivijure-cf
        run: node scripts/comment-symbol-refs.mjs
