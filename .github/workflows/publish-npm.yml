name: Publish npm package

# Publish @skyphusion-labs/vivijure-core to the public npm registry.
# Tag push: git tag vivijure-core-v1.2.2 && git push origin vivijure-core-v1.2.2
# Then create the GitHub Release (npm CI does NOT do this):
#   gh release create vivijure-core-v1.2.2 --title "vivijure-core v1.2.2" --notes-file notes.md
# Full release checklist: RELEASES.md
# Or: workflow_dispatch (uses version in package.json).
#
# Required repo secret: NPM_TOKEN (npmjs.com automation token with publish scope
# for the @skyphusion-labs org).

on:
  push:
    tags:
      - "vivijure-core-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish @skyphusion-labs/vivijure-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert commit is on main (no publish of an unreviewed release)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi

      - name: Checkout vivijure (quality-tier-drift module manifests)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # EVERY PATH THESE TWO MODULES IMPORT HAS TO BE IN THIS LIST, not just the module dirs.
          # quality-tier-drift imports the module ENTRY POINTS to read MANIFEST, so it inherits
          # their ENTIRE import graph. A missing path does not fail at checkout; it fails later
          # inside the test as ERR_MODULE_NOT_FOUND, reading like our bug rather than a missing file.
          # modules/_shared is imported by BOTH (../../_shared/runpod-job-log, cf#279). See local#295.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/_shared
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#vivijure-core-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag vivijure-core-v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # An UNRELEASED version must never reach npm. Until 1.8.0 was opened, a stray
      # workflow_dispatch was harmless only by accident: package.json named an ALREADY-PUBLISHED
      # version, so the idempotency check below printed "Skip: already published" and exited 0.
      # Opening an unpublished version removes that accident -- a dispatch would sail past the skip
      # and publish untagged main. The tag-vs-package check above cannot catch it; it is gated to
      # tag pushes. So refuse explicitly on the changelog's own claim. (core#159, core#119)
      - name: Refuse to publish an Unreleased version
        run: |
          set -euo pipefail
          top="$(grep -m1 '^## ' CHANGELOG.md || true)"
          if printf '%s' "$top" | grep -qi 'unreleased'; then
            echo "REFUSED: top CHANGELOG heading is still Unreleased:" >&2
            echo "  $top" >&2
            echo "package.json $(node -p "require('./package.json').version") is OPEN, not released." >&2
            echo "Cut the release (retitle the heading, tag, GitHub Release) before publishing." >&2
            exit 1
          fi

      - name: Publish to npm
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "${pkg}@${ver}" version >/dev/null 2>&1; then
            echo "Skip: ${pkg}@${ver} already published"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
