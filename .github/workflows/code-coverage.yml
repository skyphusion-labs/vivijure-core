name: coverage

# Vitest v8 coverage -> cobertura upload for GitHub Code Coverage (org required check)
# plus a downloadable artifact for inspection. Fork PRs skip the upload step.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  code-quality: write
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout vivijure (module manifest drift guard)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # Prefer data-only modules/*/src/manifest.ts (cf#285) -- vitest aliases to the leaf when
          # present, so the guard does not inherit entrypoint import graphs. modules/_shared stays
          # listed for checkouts that still only have MANIFEST on the entrypoint (pre-cf#285).
          # A missing path does not fail at checkout; it fails later as ERR_MODULE_NOT_FOUND.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/_shared
          sparse-checkout-cone-mode: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to GitHub Code Coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: ./coverage/cobertura-coverage.xml
          language: javascript

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
