name: CodeQL

# Estate standard: in-repo CodeQL for JS/TS + Actions. PR trigger unfiltered so
# stacked PRs still get analysis. Schedule weekly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Structurally uncollidable, for two independent reasons:
    # 1. An explicit job name that interpolates the matrix is used VERBATIM; GitHub cannot
    #    append its own matrix suffix to it. This repo is the in-estate proof: it already
    #    interpolates and emits exactly the interpolated string, with no doubled suffix.
    # 2. The literal prefix "CodeQL scan " is not a string the other producer (the dynamic
    #    GitHub Code Quality workflow) can emit; that one only ever emits "Analyze".
    # Do NOT change the job id (analyze) or the category inputs: those, not the display name,
    # key the code-scanning analysis_key and category, and alert continuity rides on them.
    name: CodeQL scan (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "no package.json; skipping install"
          fi
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
